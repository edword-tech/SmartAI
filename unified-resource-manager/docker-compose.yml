# 本机 Docker Compose 运行：后端 API + Web 前端
# 使用方式: docker compose up -d
# 访问: http://localhost:3000 （Web） / http://localhost:8080 （API）

services:
  unified-resource-manager:
    image: hub.dataagent.cc/dev/unified-resource-manager:v1.0.0
    container_name: unified-resource-manager
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  unified-resource-manager-web:
    image: hub.dataagent.cc/dev/unified-resource-manager-web:v1.0.0
    container_name: unified-resource-manager-web
    ports:
      - "3000:80"
    volumes:
      # 本机运行时后端监听 8080，覆盖 nginx 代理到 8080
      - ./deploy/docker/nginx-docker-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      unified-resource-manager:
        condition: service_healthy
    restart: unless-stopped
