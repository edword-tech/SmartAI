apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-resource-manager-web
  namespace: flexai-system
  labels:
    app: unified-resource-manager-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified-resource-manager-web
  template:
    metadata:
      labels:
        app: unified-resource-manager-web
    spec:
      containers:
      - name: web
        image: flexai/unified-resource-manager-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: unified-resource-manager-web
  namespace: flexai-system
  labels:
    app: unified-resource-manager-web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: unified-resource-manager-web

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unified-resource-manager-web
  namespace: flexai-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: resource-manager.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: unified-resource-manager-web
            port:
              number: 80
