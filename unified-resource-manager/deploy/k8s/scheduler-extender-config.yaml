# kube-scheduler 扩展器配置：把 GPU/NPU 拓扑、切分、Gang 交给 Unified Resource Manager
#
# 用法：
#   1. 将本文件挂到 kube-scheduler 的 --config
#   2. 或把 extender 段合并进现有 KubeSchedulerConfiguration
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
leaderElection:
  leaderElect: false
extenders:
  - urlPrefix: "http://unified-resource-manager:8080/scheduler/extender"
    filterVerb: filter
    prioritizeVerb: prioritize
    weight: 5
    enableHTTPS: false
    nodeCacheCapable: true
    ignorable: true
    managedResources:
      - name: nvidia.com/gpu
        ignoredByScheduler: false
      - name: huawei.com/npu
        ignoredByScheduler: false
      - name: huawei.com/vgpu-number
        ignoredByScheduler: false
---
